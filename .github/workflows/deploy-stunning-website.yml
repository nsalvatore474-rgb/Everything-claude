name: Deploy stunning-website to GitHub Pages

on:
  push:
    branches:
      - claude/stunning-website-r45k08
    paths:
      - "stunning-website/**"
      - ".github/workflows/deploy-stunning-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stunning-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
